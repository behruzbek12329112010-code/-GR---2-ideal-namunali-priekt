<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzMovi Premium - Shaxsiy Kabinet</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./registrassiya.css">
</head>
<body>

    <div id="dynamicMovieBg" class="movie-bg-overlay"></div>

    <div id="splashLoader" class="loader-overlay">
        <div class="spinner"></div>
        <p>Xavfsiz tizim holati tekshirilmoqda...</p>
    </div>

    <div id="authSection" class="auth-container hidden">
        <div class="login-card">
            <h2 class="logo-title">UZ <span>XTECH</span></h2>
            <p id="formSubtitle" class="subtitle">Premium olamga kirish uchun hisobingizga kiring</p>
            
            <div class="input-group">
                <label> Pochta</label>
                <input type="text" id="emailInput" placeholder="username@gmail.com" oninput="tekshirishValidatsiya()">
            </div>
            
            <div class="input-group">
                <label>Parol</label>
                <input type="password" id="passwordInput" placeholder="••••••••••" oninput="tekshirishValidatsiya()">
            </div>

            <button id="mainActionBtn" class="submit-btn" onclick="aksiyaniBajarish()">Kirish </button>

            <div class="switch-mode-box">
                <span id="switchText">Hisobingiz yo'qmi?</span>
                <span id="switchBtn" class="switch-link" onclick="rejimniAlmashtirish()">Ro'yxatdan o'tish</span>
            </div>
        </div>
    </div>

    <div id="profileSection" class="profile-wrapper hidden">
        <div class="user-banner">
            <div class="user-avatar" id="avatarLetter">U</div>
            <div class="user-details">
                <h2 id="userEmailTitle">u_s_e_r@gmail.com</h2>
                <span class="premium-badge"> FOYDALANUVCHI</span>
            </div>
            <div class="banner-actions">
                <a href="../Home-page/index.html" class="home-link-btn">Bosh sahifa </a>
                <button class="logout-btn" onclick="tizimdanChiqish()">Hisobdan chiqish  </button>
            </div>
        </div>

        <div class="add-movie-section">
            <h3>Yangi film qo'shish paneli</h3>
            <div class="search-input-wrapper">
                <input type="text" id="movieTitleInput" placeholder="Kino nomini inglizcha kiriting..." onkeydown="inputEnterTekshirish(event)">
                <button id="searchInlineBtn" onclick="yangiKinoQoshish()">🔍</button>
            </div>
        </div>

        <h3 class="section-title"> Sevimlilar siz va biz bilan  </h3>
        <div id="moviesGridBox" class="movies-grid"></div>
    </div>

    <script src="./registrassiya.js"></script>
</body>
</html>
