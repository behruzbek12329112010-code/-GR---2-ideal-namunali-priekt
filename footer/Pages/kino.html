<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineWave - Premium Movie App</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/footer/css/kino.css" />
</head>
<body>

<div class="container">

  <aside class="sidebar">

    <div class="logo">
      <i class="fa-solid fa-clapperboard"></i>
      <span>Cine<span>Wave</span></span>
    </div>

    <p class="menu-title">Kashf etish</p>

    <div class="menu-group">
      <button onclick="getMovies('popular')">🔥 Popular</button>
      <button onclick="getMovies('top_rated')">⭐ Top Rated</button>
      <button onclick="getMovies('upcoming')">📅 Upcoming</button>
      <button onclick="getMovies('now_playing')">▶ Now Playing</button>
    </div>

  </aside>

  <main>

    <header class="main-header">
      <h1>Movies</h1>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
          type="text"
          placeholder="Kinolarni qidirish..."
          oninput="searchMovies(this.value)">
      </div>
    </header>

    <div id="movies"></div>

  </main>

</div>

<!-- MODAL -->
<div id="trailerModal" class="modal">
  <div class="modal-content">

    <button class="close-btn" onclick="closeTrailer()">
      &times;
    </button>

    <iframe id="trailerPlayer" allowfullscreen></iframe>

  </div>
</div>

  <script src="/footer/js/kino.js"></script>
</body>
</html>
